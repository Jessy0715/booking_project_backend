spring.application.name=booking-project

server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking}

spring.jpa.hibernate.ddl-auto=update

# schema.sql 要等 Hibernate 建完表才跑（裡面的索引依賴 bookings 表存在）
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# 把 Hibernate 執行的每一條 SQL 印出來
spring.jpa.show-sql=false
# 排版成多行
spring.jpa.properties.hibernate.format_sql=true

# 允許跨域的前端來源。多個用逗號分隔，正式環境用 CORS_ALLOWED_ORIGINS 覆蓋
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT。secret 至少 32 bytes（HS256 要求），正式環境務必用環境變數覆蓋
app.jwt.secret=${JWT_SECRET:dev-only-change-me-please-at-least-32-bytes-long}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.issuer=booking-project

# 圖片上傳。超過大小 Spring 會在進 Controller 前就擋下（MaxUploadSizeExceededException）
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 圖片存哪：local（本機硬碟，預設）或 cloudinary（部署用）
app.upload.storage=${UPLOAD_STORAGE:local}

# local 專用：存檔資料夾（相對於專案根目錄）與對外的網址前綴
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8088/uploads}

# cloudinary 專用：連線字串從 Cloudinary 後台複製，格式 cloudinary://<api_key>:<api_secret>@<cloud_name>
# 含 secret，只能放環境變數，絕對不要寫在這裡或任何會進 git 的檔案
app.upload.cloudinary.url=${CLOUDINARY_URL:}
# 上傳到 Cloudinary 的資料夾，每日重置時整個資料夾一起清
app.upload.cloudinary.folder=${CLOUDINARY_FOLDER:booking/rooms}

logging.level.com.jessy.booking_project.upload=DEBUG

# 讀專案根目錄的 .env（沒有也沒關係）。機密只放那裡，.env 已在 .gitignore
spring.config.import=optional:file:.env[.properties]

# Demo 站每日重置的時間（只在 SPRING_PROFILES_ACTIVE=demo 時有作用）。
# 秒 分 時 日 月 星期；預設每天 04:00（Asia/Taipei）。
# 設成 "-" 可停用排程，但仍保留 POST /api/demo/reset 手動觸發
app.demo.reset.cron=${DEMO_RESET_CRON:0 0 4 * * *}
